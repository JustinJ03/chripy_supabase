name: chripy
description: A local Supabase social app for learning Flutter on Windows and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
